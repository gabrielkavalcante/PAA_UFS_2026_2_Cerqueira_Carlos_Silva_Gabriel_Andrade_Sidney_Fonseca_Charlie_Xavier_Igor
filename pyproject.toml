[project]
name = "paa-1"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "nltk>=3.9.1",
    "pandas>=3.0.5",
    "rank-bm25>=0.2.2",
]

[tool.pyright]
extraPaths = ["src", "tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
